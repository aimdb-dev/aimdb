[package]
name = "aimdb-mqtt-connector"
version = "0.6.0"
edition = "2021"
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "MQTT connector for AimDB - bidirectional pub/sub for Tokio and Embassy runtimes"
keywords = ["mqtt", "connector", "iot", "embedded", "pubsub"]
categories = ["network-programming", "embedded", "asynchronous"]

[features]
default = ["aimdb-core/alloc"]
# `aimdb-core/connector-session` provides the data-plane `pump_sink`/`pump_source`
# helpers the tokio client builds on (re-exported there; `std` implies it too).
std = ["aimdb-core/std", "aimdb-core/alloc", "aimdb-core/connector-session", "thiserror"]
tokio-runtime = [
    "std",
    "tokio",
    "rumqttc",
    "uuid",
    "async-stream",
    "futures-util",
]
# TLS backend for the tokio client (`mqtts://`). Pick one, or neither.
#
# Neither is a real choice rather than an oversight: a deployment that speaks
# `mqtt://` on a trusted network links no TLS stack at all, which for a shared
# library is the difference between inheriting a system OpenSSL ABI and
# inheriting nothing. `mqtts://` then fails at connect time with a message
# naming the missing feature, rather than at the linker.
tokio-native-tls = ["tokio-runtime", "rumqttc/use-native-tls"]
tokio-rustls = ["tokio-runtime", "rumqttc/use-rustls", "dep:rustls-native-certs"]

embassy-runtime = [
    "aimdb-core/alloc",                          # Need alloc for collect_inbound_routes
    "aimdb-core/connector-session",              # `pump_sink`/`pump_source`/`Source`/`Payload`
    "dep:aimdb-embassy-adapter",                 # Enable the optional dependency
    "aimdb-embassy-adapter/embassy-net-support", # Enable EmbassyNetwork trait for network stack access
    "aimdb-embassy-adapter/connectors",          # `EmbassySink`/`EmbassySource`/`into_box_future` spine
    "aimdb-embassy-adapter/net",                 # `EmbassyNet::tcp` — the adapter owns the socket
    "embassy-executor",
    "embassy-time",
    "embassy-sync",
    "embassy-net",
    "mountain-mqtt",
    # The `SocketTransport` bridge names these traits in its bounds, and the
    # session loop bridges core's `Delay` to the client's `DelayNs`.
    "dep:embedded-io-async",
    "dep:embedded-hal-async",
    "heapless",
]
# TLS (`mqtts://`) for the Embassy client — design 044. embedded-tls 1.3
# session over the Embassy TCP socket, pure-Rust certificate verification
# (`rustpki`; `rsa`/`p384` so public CA chains verify out of the box), broker
# hostname resolution (embassy-net DNS), and the SNTP time source (UDP).
embassy-tls = [
    "embassy-runtime",
    "dep:embedded-tls",
    "dep:embedded-io-async",
    "dep:rand_core",
    "embassy-net/dns",
    "embassy-net/udp",
]
# Design 050 §10.4/§10.5: the facade reaches both destinations through
# `aimdb_core::__private`, so neither dependency is declared here any more.
# The *features* stay: a `#[cfg]` in a `#[macro_export]`ed macro is resolved
# where it expands, so without them this crate would emit nothing.
# The session channels use `CriticalSectionRawMutex`, so a std binary must link
# a `critical-section` impl. Off by default: an MCU's HAL already provides one.
critical-section-std-impl = ["dep:critical-section", "critical-section/std"]

tracing = ["aimdb-core/tracing"]
log = ["aimdb-core/log"]
defmt = [
    "dep:defmt",
    "aimdb-core/defmt",
    "mountain-mqtt?/defmt",
]

# Internal: the embedded backend's host smoke over `TokioNet::tcp()`
# (`tests/tokio_broker.rs`) — a real TCP socket and a fake broker, no network
# stack. Run with `--features _test-tokio-broker`.
_test-tokio-broker = [
    "embassy-runtime",
    "aimdb-embassy-adapter/embassy-time",
    "aimdb-embassy-adapter/embassy-sync",
    "critical-section-std-impl",
]

# Internal: both backends against one fake broker in one process
# (`tests/backend_parity.rs`). Run with `--features _test-backend-parity`.
_test-backend-parity = ["_test-tokio-broker", "tokio-runtime"]

# Internal: the Embassy broker session loop's host smoke
# (`tests/embassy_broker.rs`) stands up two `embassy-net` stacks wired by an
# in-memory driver-channel crossover, with a fake broker on one side. Kept off
# `embassy-runtime` (production pulls no network device or critical-section
# impl). Run with `--features _test-embassy-broker`.
_test-embassy-broker = [
    "embassy-runtime",
    # The test builds an `AimDb`; `EmbassyAdapter`'s `RuntimeOps` impl is gated
    # on the adapter's own clock feature, which production never needs here.
    "aimdb-embassy-adapter/embassy-time",
    "aimdb-embassy-adapter/embassy-sync",
    "embassy-net/medium-ip",
    "embassy-net/proto-ipv4",
    "dep:embassy-net-driver-channel",
    "critical-section-std-impl",
]

[dependencies]
aimdb-core = { version = "1.1.0", path = "../aimdb-core", default-features = false }
aimdb-embassy-adapter = { version = "0.6.0", path = "../aimdb-embassy-adapter", default-features = false, optional = true }

# Error handling (std only)
thiserror = { workspace = true, optional = true }

# UUID generation for client IDs (std only)
uuid = { version = "1.0", features = ["v4"], optional = true }

# Tokio runtime dependencies (std)
tokio = { workspace = true, optional = true, features = ["sync", "time"] }
# No TLS feature here: the backend is the consumer's choice, made through
# `tokio-native-tls` or `tokio-rustls`. rumqttc's own default is `use-rustls`;
# `default-features = false` keeps that from arriving behind the choice.
rumqttc = { version = "0.25", optional = true, default-features = false }

# Platform trust roots for the rustls backend. rumqttc's
# `TlsConfiguration::default()` loads these too, but `expect`s on failure — and
# a panic on the connect path is what an FFI consumer cannot afford.
rustls-native-certs = { version = "0.8", optional = true }
async-stream = { version = "0.3", optional = true }
futures-util = { version = "0.3", optional = true, default-features = false, features = [
    "alloc",
] }
futures-core = { version = "0.3", default-features = false }

# Embassy runtime dependencies (no_std). Only embassy-sync still comes from the
# local checkout — see the workspace `[patch.crates-io]` for why.
embassy-executor = { version = "0.10.0", optional = true }
embassy-time = { version = "0.5.1", optional = true }
embassy-sync = { version = "0.8.0", path = "../_external/embassy/embassy-sync", optional = true }
embassy-net = { version = "0.9.0", optional = true, features = [
    "tcp",
    "dhcpv4",
    "medium-ethernet",
    "proto-ipv4",
] }

# MQTT for Embassy — aimdb-dev fork: adds `ConnectionSettings::authenticated`
# and embassy 0.9/0.8/0.5.1, so upstream 0.2.0 doesn't build. A patch won't fix
# that downstream. Keyed as before to keep imports and feature references.
mountain-mqtt = { package = "aimdb-mountain-mqtt", version = "0.2.1", default-features = false, optional = true, features = [
    "embedded-io-async",
    "embedded-hal-async",
] }

# TLS for the Embassy client (no_std TLS 1.3; design 044)
embedded-tls = { version = "0.19", default-features = false, optional = true, features = [
    "rustpki",
    "rsa",
    "p384",
] }
embedded-io-async = { workspace = true, optional = true }
embedded-hal-async = { workspace = true, optional = true }
rand_core = { version = "0.6", default-features = false, optional = true }

# Embedded utilities
heapless = { workspace = true, optional = true }

# Optional observability
defmt = { workspace = true, optional = true }

embassy-net-driver-channel = { version = "0.4.0", optional = true }
critical-section = { version = "1.1", optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
heapless = { workspace = true }
futures = "0.3"
embassy-time-driver = "0.2.2"
# The loopback harness must supply the defmt symbols smoltcp references.
defmt = { workspace = true }
tokio-test = "0.4"
serde = { workspace = true }
aimdb-data-contracts = { path = "../aimdb-data-contracts", default-features = false, features = [
    "linkable-postcard",
] }
aimdb-tokio-adapter = { path = "../aimdb-tokio-adapter", features = [
    "tokio-runtime",
    "embedded-io",
] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
