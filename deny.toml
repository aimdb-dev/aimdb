[licenses]
version = 2
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause", # BSD 3-Clause - used by subtle crate
    "ISC",          # ISC License - used by ring, rustls-webpki, untrusted
    "0BSD",         # BSD Zero Clause License - used by embassy-net dependencies
    "Unicode-3.0",
    "MPL-2.0",      # Mozilla Public License 2.0 - used by colored crate (CLI only)
    "OpenSSL",      # OpenSSL License - used by aws-lc-sys (transitive via rumqttc/rustls)
    "Zlib",         # Zlib License - used by foldhash (hashbrown default hasher)
    "CDLA-Permissive-2.0", # Community Data License (permissive) - Mozilla's CA data in webpki-roots/webpki-root-certs (via zenoh-link-commons)
]

confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"
deny = [{ name = "heapless", version = ">=0.9.0, <0.9.4", reason = "Keep the 0.8 advisory exceptions from masking vulnerable 0.9 releases" }]

[advisories]
version = 2
yanked = "warn"
# These transitive advisories are accepted for the current workspace because the
# upstream dependency chain has no viable replacement path at the moment.
ignore = [
    "RUSTSEC-2026-0110", # bare-metal deprecated via cortex-m (embedded-only transitive)
    "RUSTSEC-2026-0173", # TEMP: proc-macro-error2 unmaintained (transitive via defmt-macros/tabled_derive)
    "RUSTSEC-2024-0436", # paste unmaintained: proc-macro only, via zenoh-keyexpr/token-cell (zenoh connector)
    "RUSTSEC-2025-0134", # rustls-pemfile unmaintained (transitive via rumqttc and zenoh-link-commons)
    "RUSTSEC-2024-0449", # unsafe-libyaml unmaintained, via serde_yaml from zenoh-config (zenoh connector never parses YAML config) and aimdb-cli's optional yaml feature
    "RUSTSEC-2026-0041", # lz4_flex decompression, via zenoh-transport: compiled only with transport_compression, which the zenoh connector never enables (see .cargo/audit.toml)
    "RUSTSEC-2026-0441", # pin-utils unmaintained, via hyper 1.8.1 (axum, reqwest); no safe upgrade, hyper itself depends on it
    "RUSTSEC-2026-0543", # chrono unmaintained, no safe upgrade; via embassy-stm32 (embedded examples) and aimdb-cli/aimdb-mcp
    "RUSTSEC-2026-0542", # humantime unmaintained (follows chrono), no safe upgrade; via uhlc from zenoh (zenoh connector)
    # TEMP: heapless 0.8 unsound advisories, fixed only in >=0.9.4 (our 0.9 graph is on 0.9.4).
    # 0.8 stays until aimdb-mountain-mqtt (heapless ^0.8 in its public API) is republished on 0.9.
    "RUSTSEC-2026-0574", # FindMutView::pop use after free
    "RUSTSEC-2026-0575", # Spsc::peek Relaxed ordering
    "RUSTSEC-2026-0576", # IndexMap::truncate inconsistent state
    "RUSTSEC-2026-0577", # panicking Drop
    "RUSTSEC-2026-0578", # SortedLinkedList::zeroize inconsistent state
    "RUSTSEC-2026-0579", # Deque TryFrom when full
    "RUSTSEC-2026-0580", # treiber stack race
    "RUSTSEC-2026-0581", # Deque::make_contiguous broken invariants
    "RUSTSEC-2026-0582", # IndexMap::insert at u16::MAX elements
]

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    "https://github.com/embassy-rs/stm32-data-generated", # Required for embassy-stm32
]
