[package]
name = "aimdb-core-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
aimdb-core = { path = "..", default-features = false, features = ["alloc"] }

[[bin]]
name = "envelope"
path = "fuzz_targets/envelope.rs"
test = false
doc = false
bench = false

# Independent workspace: fuzz instrumentation never reaches production builds.
[workspace]
