[package]
name = "aimdb-tcp-connector"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Length-prefixed TCP transport connector for AimDB remote access (AimX over TCP), tokio + Embassy"
keywords = ["aimdb", "connector", "tcp", "remote", "embedded"]
categories = ["network-programming", "embedded", "no-std"]

[features]
default = ["aimdb-core/alloc"]

# The connector needs core's session layer, and nothing else: `src/` names no
# adapter and no `std::`, so one gate covers every target. A runtime is chosen by
# passing an adapter's dialer/listener — a dependency the caller adds, not a
# feature here — which is what lets a third runtime work with no edit to this
# crate.
connector = [
    "aimdb-core/alloc",
    "aimdb-core/connector-session",
    "aimdb-core/remote",
]

# Orthogonal to `connector`: the code is `alloc`-only either way, so this only
# lifts `no_std` and forwards core's own `std`.
std = ["connector", "aimdb-core/std"]

# Deprecated aliases. They name executors this crate never mentions, which blocks
# a FreeRTOS/lwIP build from enabling the connector without claiming to be
# Embassy. Kept so existing consumers and CI legs keep working; remove after a
# release.
tokio-runtime = ["std"]
embassy-runtime = ["connector"]

tracing = ["aimdb-core/tracing"]
defmt = ["aimdb-core/defmt"]

_test-tokio = ["tokio-runtime", "dep:aimdb-tokio-adapter", "aimdb-tokio-adapter/net"]

# Internal: the Embassy TCP half's runtime smoke (`tests/embassy_loopback.rs`)
# stands up two real `embassy-net` stacks wired by an in-memory driver-channel
# crossover, so it needs `medium-ip`/`proto-ipv4` and the host-only loopback
# deps. Kept off `embassy-runtime` (production never pulls a network device or a
# critical-section impl) and out of `[dev-dependencies]` (they would compile into
# the `_test-tokio` build too). Run with `--features _test-embassy-loopback`.
_test-embassy-loopback = [
    "embassy-runtime",
    "dep:aimdb-embassy-adapter",
    "aimdb-embassy-adapter/connectors",
    "aimdb-embassy-adapter/net",
    "dep:embassy-net",
    "embassy-net/medium-ip",
    "embassy-net/proto-ipv4",
    "dep:embassy-net-driver-channel",
    "dep:critical-section",
]

[dependencies]
aimdb-core = { version = "1.1.0", path = "../aimdb-core", default-features = false }

aimdb-embassy-adapter = { version = "0.6.0", path = "../aimdb-embassy-adapter", default-features = false, optional = true }

# Test-only: the loopback harness stands up two real stacks (see
# `_test-embassy-loopback`). The crate itself names no socket type.
embassy-net = { workspace = true, optional = true }

aimdb-tokio-adapter = { version = "0.6.0", path = "../aimdb-tokio-adapter", optional = true }

# test-only (see `_test-embassy-loopback`)
embassy-net-driver-channel = { version = "0.4.0", optional = true }
critical-section = { version = "1.1", features = ["std"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "io-util", "net"] }
serde = { workspace = true }
serde_json = { workspace = true }
# The Embassy loopback smoke expands `host_test_stubs!()` (no-op defmt logger +
# host time driver) and drives the stack with `futures::executor::block_on`; the
# macro references `defmt`/`embassy-time-driver` at the call site.
futures = { workspace = true }
defmt = { workspace = true }
embassy-time-driver = "0.2.2"
# `StaticConfigV4.dns_servers` is a heapless 0.9 `Vec` (embassy-net's version).
heapless = "0.9"

[[example]]
name = "tcp_demo"
required-features = ["_test-tokio"]
