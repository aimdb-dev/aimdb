[package]
name = "aimdb-uds-connector"
version = "0.1.0"
edition = "2021"
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Unix-domain-socket transport connector for AimDB: record mirroring and remote access (AimX over UDS)"
keywords = ["aimdb", "connector", "uds", "unix-socket", "remote"]
categories = ["network-programming", "database"]

[features]
default = []
# Design 050 §10.4/§10.5: the facade reaches both destinations through
# `aimdb_core::__private`, so neither dependency is declared here any more.
# The *features* stay: a `#[cfg]` in a `#[macro_export]`ed macro is resolved
# where it expands, so without them this crate would emit nothing.
tracing = ["aimdb-core/tracing"]
log = ["aimdb-core/log"]

[dependencies]
# AimX protocol (codec + dispatch) and the generic session connectors live in
# core; this crate contributes only the UDS transport triple + sugar. UDS is
# Linux/std-only, so there is no Embassy half.
aimdb-core = { version = "1.1.0", path = "../aimdb-core", features = [
    "std",
    "connector-session",
] }
tokio = { version = "1", features = ["net", "io-util"] }


[dev-dependencies]
aimdb-tokio-adapter = { version = "0.6.0", path = "../aimdb-tokio-adapter" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
# For the crate-level doc example (a mirrored record needs a JSON shape)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0" 
