[package]
name = "aimdb-codegen"
version = "0.4.1"
edition = "2021"
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Discontinued: code generation from .aimdb/state.toml for AimDB. Write the wiring in Rust instead (see README)"
readme = "README.md"
keywords = ["codegen", "architecture", "mermaid", "schema", "aimdb"]
categories = ["development-tools"]

[dependencies]
proc-macro2 = "1"
prettyplease = "0.2"
quote = "1"
serde = { version = "1.0", features = ["derive"] }
syn = "2"
toml = "0.8"

[dev-dependencies]
# No external dev deps — integration tests use generated string content
