[package]
name = "embedded-check-fixture"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Build-only fixture: an Embassy application's contracts and wiring, checked by `make test-embedded` and `make check-no-sim`"
publish = false

[features]
default = []
# The dev-tier simulation build. `rand` is the tracer `make check-no-sim` uses:
# the default graph must not contain it, and this one must.
sim = ["aimdb-data-contracts/simulatable", "dep:rand"]

[dependencies]
# JSON on the wire (`#[derive(Linkable)]`) and a migration chain, `no_std + alloc`.
aimdb-data-contracts = { path = "../../aimdb-data-contracts", default-features = false, features = [
    "linkable-json",
    "migratable",
] }
serde = { workspace = true }
serde_json = { workspace = true }
rand = { version = "0.10.1", default-features = false, optional = true }

# The Embassy wiring (`wiring.rs`) is built for the MCU only: the executor's
# Cortex-M code does not build on the host, where the lock test runs.
[target.'cfg(target_os = "none")'.dependencies]
aimdb-core = { path = "../../aimdb-core", default-features = false, features = [
    "alloc",
] }
aimdb-embassy-adapter = { path = "../../aimdb-embassy-adapter", default-features = false, features = [
    "alloc",
    "embassy-runtime",
] }

[dev-dependencies]
# `catalog!` checks `aimdb.lock` in this crate's tests; dev-only, so the
# Cortex-M builds never see it.
aimdb-data-contracts = { path = "../../aimdb-data-contracts", features = ["lock"] }
