[package]
name = "aimdb-mcp"
version = "0.10.0"
edition = "2021"
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Model Context Protocol (MCP) server for AimDB - enables LLM-powered introspection"
repository.workspace = true
homepage.workspace = true
keywords = ["mcp", "llm", "ai", "introspection", "protocol"]
categories = ["development-tools", "network-programming"]

[[bin]]
name = "aimdb-mcp"
path = "src/main.rs"

[package.metadata.cargo-all-features]
skip_optional_dependencies = true

[package.metadata.docs.rs]
all-features = true

[lib]
name = "aimdb_mcp"
path = "src/lib.rs"

[features]
default = []
# Add the serial transport to the endpoint resolver, so an `endpoint` of
# `serial://…` works. Off by default (pulls tokio-serial → libudev on Linux).
transport-serial = ["aimdb-client/transport-serial"]

[dependencies]
# AimDB dependencies
aimdb-client = { version = "0.8.0", path = "../../aimdb-client", features = [
    "observability",
] }

# Async runtime
tokio = { version = "1.48", features = [
    "io-std",
    "macros",
    "rt-multi-thread",
    "sync",
    "time",
] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# CLI
clap = { version = "4", features = ["derive"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
once_cell = "1.20"
chrono = "0.4"

[dev-dependencies]
# `__event_capture!` for the test-only `events::capture` module.
aimdb-core = { version = "3.0.0", path = "../../aimdb-core", default-features = false }
tokio-test = "0.4"
# tests/get_record.rs: a real AimX server over a Unix socket.
aimdb-tokio-adapter = { version = "0.8.0", path = "../../aimdb-tokio-adapter" }
aimdb-uds-connector = { version = "0.2.0", path = "../../aimdb-uds-connector" }
tempfile = "3"
# tests/serial_session.rs: a board (`SerialServer`) behind a pty.
aimdb-serial-connector = { version = "0.2.0", path = "../../aimdb-serial-connector", features = [
    "std",
] }
libc = "0.2"
