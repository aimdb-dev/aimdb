[package]
name = "rolling-contracts-n"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
aimdb-core = { path = "../../../aimdb-core", default-features = false, features = ["alloc"] }
aimdb-data-contracts = { path = "../../../aimdb-data-contracts", default-features = false, features = ["migratable", "linkable-postcard", "linkable-cdr"] }
serde = { workspace = true }

[dev-dependencies]
aimdb-data-contracts = { path = "../../../aimdb-data-contracts", features = ["lock"] }
