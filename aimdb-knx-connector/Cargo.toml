[package]
name = "aimdb-knx-connector"
version = "0.5.0"
edition = "2021"
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "KNX/IP connector for AimDB - building automation integration for Tokio and Embassy runtimes"
keywords = ["knx", "knxnet-ip", "building-automation", "iot", "connector"]
categories = ["network-programming", "embedded", "asynchronous"]

[features]
default = ["aimdb-core/alloc"]
std = ["aimdb-core/std", "knx-pico/std", "thiserror"]
tokio-runtime = ["std", "tokio", "uuid", "async-stream", "futures-util"]
embassy-runtime = [
    "aimdb-core/alloc",                          # Need alloc for collect_inbound_routes
    "aimdb-core/connector-session",              # `pump_sink`/`pump_source`/`Source`/`Payload`
    "dep:aimdb-embassy-adapter",                 # Enable the optional dependency
    "aimdb-embassy-adapter/embassy-net-support", # Enable EmbassyNetwork trait for network stack access
    "aimdb-embassy-adapter/connectors",          # `into_box_future` spine helper
    "embassy-executor",
    "embassy-time",
    "embassy-sync",
    "embassy-net",
    "static_cell",
]
# Design 050 §10.4/§10.5: the facade reaches both destinations through
# `aimdb_core::__private`, so neither dependency is declared here any more.
# The *features* stay: a `#[cfg]` in a `#[macro_export]`ed macro is resolved
# where it expands, so without them this crate would emit nothing.
tracing = ["aimdb-core/tracing"]
log = ["aimdb-core/log"]
defmt = [
    "dep:defmt",
    "aimdb-core/defmt",
    "knx-pico/defmt",
] # Only use knx-pico's defmt for logging

[dependencies]
aimdb-core = { version = "1.1.0", path = "../aimdb-core", default-features = false }
aimdb-embassy-adapter = { version = "0.6.0", path = "../aimdb-embassy-adapter", default-features = false, optional = true }

# aimdb-dev fork: upstream 0.3.0 panics on an npdu_length=1 telegram. A patch
# won't do — patches aren't published, so dependants resolve back to upstream.
# Keyed `knx-pico` to keep imports and feature references unchanged.
knx-pico = { package = "aimdb-knx-pico", version = "0.3.1", default-features = false }

# Error handling (std only)
thiserror = { workspace = true, optional = true }

# UUID generation for client IDs (std only)
uuid = { version = "1.0", features = ["v4"], optional = true }

# Tokio runtime dependencies (std)
tokio = { workspace = true, optional = true, features = [
    "sync",
    "time",
    "net",
] }
async-stream = { version = "0.3", optional = true }
futures-util = { version = "0.3", optional = true, default-features = false, features = [
    "alloc",
] }
futures-core = { version = "0.3", default-features = false }

# Embassy runtime dependencies (no_std)
# Note: These use the workspace's local embassy checkout to avoid conflicts
embassy-executor = { version = "0.10.0", optional = true }
embassy-time = { version = "0.5.1", optional = true }
embassy-sync = { version = "0.8.0", path = "../_external/embassy/embassy-sync", optional = true }
# Design 052 §5.4: `embassy-futures` has no dependencies of its own (verified:
# its `[dependencies]` section is empty bar optional defmt/log), and its
# `select3` is what the neutral connection task uses on *both* runtimes. So it
# is unconditional rather than an Embassy-only optional.
embassy-futures = { version = "0.1.2" }
embassy-net = { version = "0.9.0", optional = true, features = [
    "tcp",
    "udp",
    "dhcpv4",
    "medium-ethernet",
    "proto-ipv4",
] }

# Embedded utilities (heapless is unconditional: the shared sans-io tunnel
# engine uses stack-allocated frames on both runtimes)
heapless = { workspace = true }
static_cell = { version = "2.0", optional = true }

# Optional observability
defmt = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
tokio-test = "0.4"
aimdb-tokio-adapter = { path = "../aimdb-tokio-adapter", features = [
    "tokio-runtime",
    # Design 052 §3.2 `Datagram`/`Delay` impls, used by `neutral`'s tests to
    # drive the unified connection task against a real fake gateway.
    "net",
] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
